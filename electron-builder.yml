appId: com.ini.inimd
productName: INIMD
copyright: Copyright © 2026 INIMD

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*
  # لا نحتاج ملفات الأنواع أو الخرائط أو المصادر وقت التشغيل
  - '!node_modules/**/*.d.ts'
  - '!node_modules/**/*.d.cts'
  - '!node_modules/**/*.d.mts'
  - '!node_modules/**/*.map'
  - '!node_modules/**/README*'
  - '!node_modules/**/CHANGELOG*'
  - '!node_modules/**/test/**'
  - '!node_modules/**/tests/**'
  - '!node_modules/**/__tests__/**'
  - '!node_modules/**/docs/**'
  - '!node_modules/**/example/**'
  - '!node_modules/**/examples/**'
  # نسخ docx المكررة غير المستخدمة (نستخدم dist/index.cjs فقط)
  - '!node_modules/docx/dist/*.iife.js'
  - '!node_modules/docx/dist/*.umd.cjs'
  - '!node_modules/docx/dist/*.ts'

extraResources:
  - from: resources
    to: resources

asar: true
compression: maximum
# نُبقي لغتين فقط بدل 55 لغة (توفير ~45 ميجابايت على القرص)
electronLanguages:
  - ar
  - en-US

win:
  icon: build/icon.ico
  executableName: INIMD
  target:
    - target: nsis
      arch:
        - x64
  artifactName: INIMD-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: INIMD
  deleteAppDataOnUninstall: false
  artifactName: INIMD-Setup-${version}.${ext}
  installerLanguages:
    - ar_SA
    - en_US

fileAssociations:
  - ext: md
    name: Markdown Document
    description: مستند Markdown
    icon: build/file-icon.ico
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: مستند Markdown
    icon: build/file-icon.ico
    role: Editor

portable:
  artifactName: INIMD-Portable-${version}.${ext}

publish:
  provider: github
  owner: inisoliman
  repo: INIMD
  private: true
  releaseType: release
