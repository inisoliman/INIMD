appId: com.ini.inimd
productName: INIMD
copyright: Copyright © 2026 INIMD

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*

extraResources:
  - from: resources
    to: resources

asar: true
compression: normal

win:
  icon: build/icon.ico
  executableName: INIMD
  target:
    - target: nsis
      arch:
        - x64
  artifactName: INIMD-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: INIMD
  deleteAppDataOnUninstall: false
  artifactName: INIMD-Setup-${version}.${ext}
  installerLanguages:
    - ar_SA
    - en_US

fileAssociations:
  - ext: md
    name: Markdown Document
    description: مستند Markdown
    icon: build/file-icon.ico
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: مستند Markdown
    icon: build/file-icon.ico
    role: Editor

portable:
  artifactName: INIMD-Portable-${version}.${ext}

publish:
  provider: github
  owner: inisoliman
  repo: INIMD
  private: true
  releaseType: release
