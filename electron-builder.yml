appId: com.midad.markdown
productName: Midad
copyright: Copyright © 2026 Midad

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - resources/**/*
  - package.json
  - node_modules/**/*

extraResources:
  - from: resources
    to: resources

asar: true
compression: normal

win:
  icon: build/icon.ico
  executableName: Midad
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Midad-Setup-${version}.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: مِداد
  deleteAppDataOnUninstall: false
  artifactName: Midad-Setup-${version}.${ext}
  installerLanguages:
    - ar_SA
    - en_US

fileAssociations:
  - ext: md
    name: Markdown Document
    description: مستند Markdown
    icon: build/file-icon.ico
    role: Editor
  - ext: markdown
    name: Markdown Document
    description: مستند Markdown
    icon: build/file-icon.ico
    role: Editor

portable:
  artifactName: Midad-Portable-${version}.${ext}

publish: null
