[package]
name = "inimd-lite"
version = "1.0.0"
description = "INIMD Lite — نسخة خفيفة من INIMD مبنية على Tauri وWebView2"
authors = ["INI <ibrahim.noshy@hotmail.com>"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "inimd_lite_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
# يفعّل تضمين أصول الواجهة داخل الملف التنفيذي (وضع الإنتاج).
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
open = "5"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
